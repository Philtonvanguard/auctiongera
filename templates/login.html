{% extends "base.html" %}
{% block title %}{{ _('Login — AuctionGera') }}{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-card-logo"><svg class="icon icon-xl"><use href="#i-mark"/></svg></div>
      <h1 class="form-card-title">{{ _('Welcome Back') }}</h1>
      <p class="form-card-subtitle">{{ _('Login to AuctionGera to start bidding') }}</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="f-username">{{ _('Username or email') }}</label>
        <input type="text" id="f-username" name="username" class="form-control"
               placeholder="{{ _('Your username or email') }}" required autofocus
               autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="form-group">
        <label class="form-label" for="f-password">{{ _('Password') }}</label>
        <input type="password" id="f-password" name="password" class="form-control" placeholder="{{ _('Your password') }}" required>
      </div>
      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" name="remember">
          <span style="color:var(--text-muted);font-size:0.9rem;">{{ _('Remember me') }}</span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">{{ _('Login') }}</button>
    </form>

    <div class="form-footer">
      {{ _("Don't have an account?") }} <a href="{{ url_for('register', lang=lang) }}">{{ _('Register free') }}</a>
    </div>
  </div>
</div>
{% endblock %}
